services:
  postgres:
    image: postgres:16-alpine
    container_name: prometeus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prometeus
      POSTGRES_PASSWORD: prometeus
      POSTGRES_DB: prometeus
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    networks:
      - prometeus_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prometeus -d prometeus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prometeus-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - prometeus_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: prometeus-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
      - "1455:8000"
    env_file:
      - .env
    volumes:
      - ./web:/app/web
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./config:/app/config
      - ./.env:/app/.env
      - ./var:/app/var
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://prometeus:prometeus@postgres:5432/prometeus
      REDIS_URL: redis://redis:6379/0
      INSTITUTION_ID: ens
      INSTITUTION_CONFIG_PATH: config/tenants/ens.example.yaml
      SCORING_PROFILE_PATH: config/scoring/default-v1.example.yaml
      JEV_MODEL: ${JEV_MODEL:-jev-v1.2.0}
      SHADOW_MODE: ${SHADOW_MODE:-false}
      KILL_SWITCH_ACTIVE: ${KILL_SWITCH_ACTIVE:-false}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    networks:
      - prometeus_internal
      - prometeus_public
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    container_name: prometeus-worker
    restart: unless-stopped
    command: ["celery", "-A", "prometeus.workers.tasks.celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./config:/app/config
      - ./.env:/app/.env
      - ./var:/app/var
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://prometeus:prometeus@postgres:5432/prometeus
      REDIS_URL: redis://redis:6379/0
      INSTITUTION_ID: ens
      INSTITUTION_CONFIG_PATH: config/tenants/ens.example.yaml
      SCORING_PROFILE_PATH: config/scoring/default-v1.example.yaml
      JEV_MODEL: ${JEV_MODEL:-jev-v1.2.0}
      SHADOW_MODE: ${SHADOW_MODE:-false}
      KILL_SWITCH_ACTIVE: ${KILL_SWITCH_ACTIVE:-false}
    networks:
      - prometeus_internal
      - prometeus_public
    healthcheck:
      test: ["CMD-SHELL", "celery -A prometeus.workers.tasks.celery_app inspect ping --timeout 5"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    container_name: prometeus-backup
    restart: unless-stopped
    networks:
      - prometeus_internal
    volumes:
      - postgres_backups:/backups
    environment:
      PGHOST: postgres
      PGUSER: prometeus
      PGPASSWORD: prometeus
      PGDATABASE: prometeus
    command: >
      sh -c 'while true; do
        echo "[Backup] Gravando snapshot diário...";
        pg_dump -U prometeus -h postgres -d prometeus -F c -b -v -f /backups/prometeus_$$(date +%Y%m%d_%H%M%S).dump;
        echo "[Backup] Snapshot concluído. Aguardando 24h...";
        sleep 86400;
      done'
    depends_on:
      postgres:
        condition: service_healthy

networks:
  prometeus_internal:
    internal: true
  prometeus_public:
    driver: bridge

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
