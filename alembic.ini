# Configuração do Alembic para migrações do Prometeus (PostgreSQL)

[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
timezone = UTC
truncate_slug_length = 40

# URL de fallback; sobrescrita por env var DATABASE_URL em migrations/env.py
sqlalchemy.url = postgresql+psycopg://prometeus:prometeus@localhost:5432/prometeus

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
